{% extends "base.html" %}

{% block title %}Create account · Facilities desk{% endblock %}

{% block content %}
  <h1>Create account</h1>
  <form class="sheet narrow" method="post" action="{{ url_for('auth.register') }}">
    <label for="name">Name</label>
    <input id="name" name="name" type="text" autocomplete="name" required autofocus>

    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" minlength="3" maxlength="30" pattern="[A-Za-z0-9_]+" required>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="new-password" required>

    <button type="submit">Create account</button>
  </form>
  <p class="aside">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
{% endblock %}
