{% extends "base.html" %}

{% block title %}New ticket · Ticketing System{% endblock %}

{% block content %}
  <h1>New ticket</h1>
  {# form.* is whatever they typed before, so nothing gets lost if it fails #}
  <form class="sheet" method="post" action="{{ url_for('tickets.new_ticket') }}">
    <label for="title">Title</label>
    <input id="title" name="title" type="text" required autofocus value="{{ form.title or '' }}">

    <label for="description">Description</label>
    <textarea id="description" name="description" rows="4">{{ form.description or '' }}</textarea>

    <label for="location">Location</label>
    <input id="location" name="location" type="text" value="{{ form.location or '' }}">

    <label for="category">Category</label>
    {# Categories come from TICKET_CATEGORIES in routes/tickets.py #}
    <select id="category" name="category">
      <option value="">Choose a category</option>
      {% for category in categories %}
        <option value="{{ category }}" {% if form.category == category %}selected{% endif %}>{{ category }}</option>
      {% endfor %}
    </select>

    <button type="submit">Submit ticket</button>
  </form>
{% endblock %}
